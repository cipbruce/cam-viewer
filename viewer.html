<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>USB Camera Viewer</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --border: #334155;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --primary: #22c55e;
      --danger: #ef4444;
      --yellow: #eab308;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    header h1 {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
    }

    #status-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-muted);
    }

    #status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--border);
      transition: background 0.3s;
    }

    #status-dot.connecting { background: var(--yellow); }
    #status-dot.connected  { background: var(--primary); }
    #status-dot.error      { background: var(--danger); }

    /* ── 主內容 ── */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      gap: 16px;
    }

    /* ── 輸入表單 ── */
    #connect-form {
      width: 100%;
      max-width: 420px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    #connect-form h2 {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-muted);
      text-align: center;
    }

    #peer-input {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 14px;
      font-family: 'Courier New', monospace;
      color: var(--text);
      width: 100%;
      outline: none;
    }

    #peer-input:focus { border-color: var(--primary); }
    #peer-input::placeholder { color: #475569; }

    #connect-btn {
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s;
    }

    #connect-btn:hover:not(:disabled) { background: #16a34a; }
    #connect-btn:disabled { background: #374151; color: #6b7280; cursor: not-allowed; }

    #connect-hint {
      font-size: 12px;
      color: #475569;
      text-align: center;
    }

    /* ── 影片播放器 ── */
    #player-wrapper {
      width: 100%;
      max-width: 960px;
      display: none;
      flex-direction: column;
      gap: 12px;
    }

    #video-container {
      position: relative;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      aspect-ratio: 16/9;
      width: 100%;
    }

    #remote-video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    /* 狀態疊層（連線中）*/
    #video-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: rgba(0,0,0,0.85);
      color: var(--text-muted);
      font-size: 14px;
    }

    #video-overlay.hidden { display: none; }

    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid #475569;
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #cancel-reconnect-btn {
      display: none;
      margin-top: 4px;
      background: transparent;
      border: 1px solid #475569;
      border-radius: 6px;
      padding: 5px 16px;
      font-size: 12px;
      color: var(--text-muted);
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }
    #cancel-reconnect-btn:hover { border-color: #94a3b8; color: var(--text); }

    /* 資訊列 */
    #info-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }

    #cam-label {
      font-size: 13px;
      color: var(--text-muted);
      font-family: monospace;
    }

    #conn-info {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--text-muted);
    }

    #conn-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--primary);
    }

    #conn-dot.relay { background: var(--yellow); }

    #fullscreen-btn, #audio-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 14px;
      font-size: 12px;
      color: var(--text-muted);
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
    }

    #fullscreen-btn:hover, #audio-btn:hover { color: var(--text); border-color: #64748b; }

    #audio-btn { display: none; }
    #audio-btn.has-audio { display: inline-block; }

    /* 錯誤訊息 */
    #error-msg {
      display: none;
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 13px;
      color: #fca5a5;
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    /* 全螢幕 */
    #video-container:fullscreen,
    #video-container:-webkit-full-screen {
      aspect-ratio: unset;
      height: 100vh;
      max-height: 100vh;
    }

    /* RWD */
    @media (max-width: 480px) {
      header { padding: 10px 12px; }
      #connect-form { padding: 16px; }
      main { padding: 12px; }
    }
  </style>
</head>
<body>

<header>
  <h1>USB Camera Viewer</h1>
  <div id="status-chip">
    <div id="status-dot"></div>
    <span id="status-text">未連線</span>
  </div>
</header>

<main>
  <!-- 輸入表單（未連線時顯示）-->
  <div id="connect-form">
    <h2>輸入 Peer ID 連接攝影機</h2>
    <input
      id="peer-input"
      type="text"
      placeholder="cam-usb-your-camera-name"
      autocomplete="off"
      autocapitalize="none"
      spellcheck="false"
    />
    <button id="connect-btn">連接</button>
    <p id="connect-hint">Peer ID 顯示於主機的攝影機卡片下方</p>
  </div>

  <!-- 播放器（連線成功後顯示）-->
  <div id="player-wrapper">
    <div id="video-container">
      <video id="remote-video" autoplay playsinline muted></video>
      <div id="video-overlay">
        <div class="spinner"></div>
        <span id="overlay-text">等待影像串流…</span>
        <button id="cancel-reconnect-btn">取消重連</button>
      </div>
    </div>

    <div id="info-bar">
      <span id="cam-label"></span>
      <div id="conn-info">
        <div id="conn-dot"></div>
        <span id="conn-type-text">偵測連線類型…</span>
        <span id="latency-text"></span>
      </div>
      <button id="audio-btn" title="音訊控制"></button>
      <button id="fullscreen-btn">全螢幕</button>
    </div>
  </div>

  <!-- 錯誤訊息 -->
  <div id="error-msg"></div>
</main>

<script>
(function () {
  // ── DOM refs ──
  const peerInput    = document.getElementById('peer-input');
  const connectBtn   = document.getElementById('connect-btn');
  const connectForm  = document.getElementById('connect-form');
  const playerWrapper = document.getElementById('player-wrapper');
  const remoteVideo  = document.getElementById('remote-video');
  const videoOverlay = document.getElementById('video-overlay');
  const overlayText  = document.getElementById('overlay-text');
  const statusDot    = document.getElementById('status-dot');
  const statusText   = document.getElementById('status-text');
  const camLabel     = document.getElementById('cam-label');
  const connDot      = document.getElementById('conn-dot');
  const connTypeText = document.getElementById('conn-type-text');
  const latencyText  = document.getElementById('latency-text');
  const fullscreenBtn = document.getElementById('fullscreen-btn');
  const audioBtn     = document.getElementById('audio-btn');
  const videoContainer = document.getElementById('video-container');
  const errorMsg     = document.getElementById('error-msg');
  const cancelReconnectBtn = document.getElementById('cancel-reconnect-btn');

  let peer = null;
  let currentCall = null;
  let statsTimer = null;
  let currentTargetPeerId = null;
  let reconnectCount = 0;
  let reconnectTimer = null;
  let countdownTimer = null;
  let iceDisconnectTimer = null;

  // ── URL 參數自動帶入 Peer ID ──
  const urlParams = new URLSearchParams(location.search);
  const idFromUrl = urlParams.get('id') || urlParams.get('peer');
  if (idFromUrl) {
    peerInput.value = idFromUrl;
    // 自動連接（延遲讓 PeerJS 載入）
    setTimeout(() => startConnect(idFromUrl), 300);
  }

  // ── 狀態更新 helpers ──
  function setStatus(dotClass, text) {
    statusDot.className = dotClass;
    statusText.textContent = text;
  }

  function showError(msg) {
    errorMsg.style.display = 'block';
    errorMsg.textContent = msg;
    setStatus('error', '連線失敗');
  }

  function hideError() {
    errorMsg.style.display = 'none';
  }

  function showForm() {
    connectForm.style.display = 'flex';
    playerWrapper.style.display = 'none';
  }

  function showPlayer(targetPeerId) {
    connectForm.style.display = 'none';
    playerWrapper.style.display = 'flex';
    camLabel.textContent = targetPeerId;
    videoOverlay.classList.remove('hidden');
    overlayText.textContent = '等待影像串流…';
  }

  // ── 連線品質輪詢 ──
  async function pollStats(peerConn) {
    if (!peerConn) return;
    try {
      const stats = await peerConn.getStats();
      for (const report of stats.values()) {
        if (report.type === 'candidate-pair' && report.state === 'succeeded' && report.nominated) {
          const localCand = stats.get(report.localCandidateId);
          const isRelay = localCand?.candidateType === 'relay';
          const rtt = report.currentRoundTripTime;

          connDot.className = isRelay ? 'relay' : '';
          connTypeText.textContent = isRelay ? 'TURN 中繼' : '直連（P2P）';
          if (rtt != null) {
            latencyText.textContent = Math.round(rtt * 1000) + ' ms';
          }
          return;
        }
      }
    } catch (_) {}
    connTypeText.textContent = '偵測中…';
    latencyText.textContent = '';
  }

  function startStatsPolling(peerConn) {
    stopStatsPolling();
    const tick = () => {
      pollStats(peerConn).then(() => {
        if (currentCall) statsTimer = setTimeout(tick, 2000);
      });
    };
    tick();
  }

  function stopStatsPolling() {
    if (statsTimer) { clearTimeout(statsTimer); statsTimer = null; }
  }

  // ── 自動重連 ──
  function scheduleReconnect() {
    if (!currentTargetPeerId) { showForm(); return; }
    const base = Math.min(3000 * Math.pow(2, reconnectCount), 30000);
    const delay = Math.round(base + Math.random() * 1000);
    const delaySec = Math.round(delay / 1000);
    reconnectCount++;

    videoOverlay.classList.remove('hidden');
    cancelReconnectBtn.style.display = 'block';
    setStatus('connecting', `${delaySec}s 後重連`);

    let remaining = delaySec;
    function tick() { overlayText.textContent = `${remaining} 秒後自動重連… (第 ${reconnectCount} 次)`; }
    tick();
    countdownTimer = setInterval(() => {
      remaining--;
      if (remaining <= 0) { clearInterval(countdownTimer); countdownTimer = null; }
      else tick();
    }, 1000);

    reconnectTimer = setTimeout(() => {
      reconnectTimer = null;
      cancelReconnectBtn.style.display = 'none';
      startConnect(currentTargetPeerId);
    }, delay);
  }

  function cancelReconnect() {
    if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
    if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }
    reconnectCount = 0;
    cancelReconnectBtn.style.display = 'none';
    showForm();
    setStatus('', '未連線');
    connectBtn.disabled = false;
  }

  // ── 主連線邏輯 ──
  function startConnect(targetPeerId) {
    hideError();
    if (!targetPeerId) { showError('請輸入 Peer ID'); return; }

    // 取消任何待執行的重連計時器
    if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
    if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }
    cancelReconnectBtn.style.display = 'none';
    currentTargetPeerId = targetPeerId;

    // 先清理舊連線
    cleanup();

    setStatus('connecting', '連線中…');
    showPlayer(targetPeerId);
    connectBtn.disabled = true;

    // 建立本端 Peer（使用隨機 ID，不需要固定）
    peer = new Peer({
      config: {
        iceServers: [
          // 多組備援 STUN（任一成功即可）
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' },
          { urls: 'stun:stun2.l.google.com:19302' },
          { urls: 'stun:stun3.l.google.com:19302' },
          { urls: 'stun:stun.cloudflare.com:3478' },
          // 自建 coturn（主力 TURN）
          { urls: 'turn:122.116.22.14:3478',               username: 'user1', credential: '123Qweasd' },
          { urls: 'turn:122.116.22.14:3478?transport=tcp', username: 'user1', credential: '123Qweasd' },
          // TURNS（TLS port 443，穿透 HTTP Proxy / 嚴格防火牆）
          { urls: 'turns:122.116.22.14:443?transport=tcp', username: 'user1', credential: '123Qweasd' },
        ]
      }
    });

    peer.on('open', () => {
      // 呼叫主機端 Peer
      const call = peer.call(targetPeerId, createDummyStream());
      currentCall = call;

      // ICE 可能靜默失敗（host 無網路時 close 訊號送不到 viewer）
      // 若 15s 內未收到 stream，視為失敗並重連
      const streamArrivalTimer = setTimeout(() => {
        if (currentCall === call) {
          console.warn('[viewer] stream arrival timeout, reconnecting…');
          cleanup();
          scheduleReconnect();
        }
      }, 15000);

      call.on('stream', (remoteStream) => {
        clearTimeout(streamArrivalTimer);
        reconnectCount = 0;
        remoteVideo.srcObject = remoteStream;
        setStatus('connected', '已連線');
        startStatsPolling(call.peerConnection);
        // 若串流含音軌，顯示靜音/取消靜音按鈕（video 預設 muted，符合 autoplay 政策）
        if (remoteStream.getAudioTracks().length > 0) {
          audioBtn.classList.add('has-audio');
          updateAudioBtn();
        }
        remoteVideo.play()
          .then(() => { videoOverlay.classList.add('hidden'); })
          .catch(() => {
            // 行動瀏覽器 autoplay 被封鎖，等待使用者手勢
            overlayText.textContent = '點擊畫面開始播放';
          });

        // Stream 播放中途若 ICE 斷線，call.on('close') 訊號可能送不到 viewer。
        // 直接在 viewer 端監聽 ICE 狀態：斷線 15s 後主動觸發重連。
        const peerConn = call.peerConnection;
        peerConn.addEventListener('iceconnectionstatechange', () => {
          const s = peerConn.iceConnectionState;
          if (s === 'disconnected' || s === 'failed') {
            if (!iceDisconnectTimer) {
              iceDisconnectTimer = setTimeout(() => {
                iceDisconnectTimer = null;
                if (currentCall === call) {
                  console.warn('[viewer] ICE disconnect timeout, reconnecting…');
                  cleanup();
                  scheduleReconnect();
                }
              }, 15000);
            }
          } else if (s === 'connected' || s === 'completed') {
            if (iceDisconnectTimer) { clearTimeout(iceDisconnectTimer); iceDisconnectTimer = null; }
          }
        });
      });

      call.on('close', () => {
        clearTimeout(streamArrivalTimer);
        stopStatsPolling();
        currentCall = null;
        connectBtn.disabled = false;
        scheduleReconnect();
      });

      call.on('error', (err) => {
        clearTimeout(streamArrivalTimer);
        console.error('[viewer] call error:', err);
        showError('串流錯誤：' + (err.message || err.type || '未知錯誤'));
        cleanup();
        showForm();
        connectBtn.disabled = false;
      });
    });

    peer.on('error', (err) => {
      console.error('[viewer] peer error:', err.type, err.message);
      cleanup();
      if (err.type === 'peer-unavailable' || err.type === 'network') {
        scheduleReconnect();
      } else {
        showError(`連線錯誤（${err.type}）：${err.message}`);
        showForm();
        connectBtn.disabled = false;
      }
    });
  }

  // Viewer 端只是觀看，不需要傳送任何串流；
  // 但 PeerJS media call 需要本端也提供含 video + audio track 的 MediaStream，
  // 否則 SDP offer 不含對應的 m= 行，host 端無法回傳影像或音訊。
  function createDummyStream() {
    const canvas = document.createElement('canvas');
    canvas.width = 1; canvas.height = 1;
    const videoTrack = canvas.captureStream(1).getVideoTracks()[0];
    const tracks = [videoTrack];
    // 加入空白音軌讓 SDP offer 包含 m=audio，host 端才能傳送麥克風音訊
    try {
      const actx = new AudioContext();
      const dest = actx.createMediaStreamDestination();
      tracks.push(dest.stream.getAudioTracks()[0]);
    } catch (_) {}
    return new MediaStream(tracks);
  }

  function updateAudioBtn() {
    audioBtn.textContent = remoteVideo.muted ? '🔇 取消靜音' : '🔊 靜音';
  }

  function cleanup() {
    if (iceDisconnectTimer) { clearTimeout(iceDisconnectTimer); iceDisconnectTimer = null; }
    stopStatsPolling();
    try { currentCall?.close(); } catch (_) {}
    try { peer?.destroy(); } catch (_) {}
    currentCall = null;
    peer = null;
    remoteVideo.srcObject = null;
    remoteVideo.muted = true;
    audioBtn.classList.remove('has-audio');
    connTypeText.textContent = '偵測連線類型…';
    latencyText.textContent = '';
    connDot.className = '';
  }

  // ── 事件綁定 ──
  videoOverlay.addEventListener('click', () => {
    if (remoteVideo.srcObject) {
      remoteVideo.play()
        .then(() => { videoOverlay.classList.add('hidden'); })
        .catch(() => {});
    }
  });

  cancelReconnectBtn.addEventListener('click', cancelReconnect);

  connectBtn.addEventListener('click', () => {
    startConnect(peerInput.value.trim());
  });

  peerInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') startConnect(peerInput.value.trim());
  });

  audioBtn.addEventListener('click', () => {
    remoteVideo.muted = !remoteVideo.muted;
    updateAudioBtn();
  });

  fullscreenBtn.addEventListener('click', () => {
    if (document.fullscreenElement) {
      document.exitFullscreen();
    } else {
      videoContainer.requestFullscreen().catch(() => {});
    }
  });

  document.addEventListener('fullscreenchange', () => {
    fullscreenBtn.textContent = document.fullscreenElement ? '退出全螢幕' : '全螢幕';
  });

  // ── 頁面離開時清理1 ──
  window.addEventListener('beforeunload', cleanup);
})();
</script>
</body>
</html>
